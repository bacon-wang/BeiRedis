<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" fill="#0f172a">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
  </defs>
  <text x="400" y="36" text-anchor="middle" font-size="16" font-weight="bold">把 HashMap 拿出来，变成大家共享的服务</text>
  <rect x="30" y="170" width="100" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="80" y="205" text-anchor="middle">负载均衡</text>
  <g stroke="#475569" stroke-width="1.5">
    <line x1="130" y1="200" x2="186" y2="110" marker-end="url(#a)"/>
    <line x1="130" y1="200" x2="186" y2="200" marker-end="url(#a)"/>
    <line x1="130" y1="200" x2="186" y2="290" marker-end="url(#a)"/>
  </g>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.5">
    <rect x="190" y="85" width="130" height="50" rx="8"/>
    <rect x="190" y="175" width="130" height="50" rx="8"/>
    <rect x="190" y="265" width="130" height="50" rx="8"/>
  </g>
  <g text-anchor="middle" font-weight="bold" fill="#2563eb">
    <text x="255" y="115">Java 程序 1</text><text x="255" y="205">Java 程序 2</text><text x="255" y="295">Java 程序 3</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.5">
    <line x1="320" y1="110" x2="376" y2="160" marker-end="url(#ab)"/>
    <line x1="320" y1="200" x2="376" y2="200" marker-end="url(#ab)"/>
    <line x1="320" y1="290" x2="376" y2="240" marker-end="url(#ab)"/>
  </g>
  <!-- Redis -->
  <rect x="380" y="90" width="390" height="220" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="575" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">Redis：内存里的共享字典</text>
  <rect x="400" y="135" width="350" height="155" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="415" y="157" font-size="12" fill="#64748b">key</text>
  <text x="565" y="157" font-size="12" fill="#64748b">value</text>
  <g stroke="#cbd5e1" stroke-width="1"><line x1="400" y1="167" x2="750" y2="167"/><line x1="400" y1="208" x2="750" y2="208"/><line x1="400" y1="249" x2="750" y2="249"/><line x1="550" y1="135" x2="550" y2="290"/></g>
  <g font-family="Menlo, Consolas, monospace" font-size="13">
    <text x="415" y="192">product:1001</text><text x="565" y="192">{名称, 价格 99…}</text>
    <text x="415" y="233">views:1001</text><text x="565" y="233">12345</text>
    <text x="415" y="274">code:138…</text><text x="565" y="274">482913</text>
  </g>
  <!-- MySQL -->
  <line x1="575" y1="310" x2="575" y2="368" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ao)"/>
  <text x="590" y="344" font-size="13" fill="#ea580c">只有 Redis 里没有时才查</text>
  <path d="M515,385 L515,445 A60,14 0 0 0 635,445 L635,385" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <ellipse cx="575" cy="385" rx="60" ry="14" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="575" y="428" text-anchor="middle" font-weight="bold" fill="#ea580c">MySQL</text>
  <text x="400" y="500" text-anchor="middle" fill="#16a34a">只有一份数据，所有程序看到的都一样</text>
</svg>
