<text x="40" y="283" font-family="Menlo, Consolas, monospace" font-size="13" fill="#2563eb">LRANGE l -2 -1</text>
<rect x="200" y="260" width="44" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="222.0" y="283.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">a</text>
