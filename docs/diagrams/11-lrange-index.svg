<rect x="332" y="260" width="44" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="354.0" y="283.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0f172a">d</text>
