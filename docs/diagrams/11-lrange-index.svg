<text x="40" y="343" font-family="Menlo, Consolas, monospace" font-size="13" fill="#2563eb">LRANGE l 3 100</text>
<rect x="200" y="320" width="44" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="222.0" y="343.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">a</text>
<rect x="244" y="320" width="44" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="266.0" y="343.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">b</text>
<rect x="288" y="320" width="44" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="310.0" y="343.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">c</text>
<rect x="332" y="320" width="44" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="354.0" y="343.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0f172a">d</text>
<rect x="376" y="320" width="44" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="398.0" y="343.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0f172a">e</text>
<text x="436" y="343" font-family="Menlo, Consolas, monospace" font-size="13" fill="#16a34a">→ d e</text>
<text x="580" y="343" font-size="12" fill="#ea580c">stop 超出，截到末尾</text>
<text x="40" y="403" font-family="Menlo, Consolas, monospace" font-size="13" fill="#2563eb">LRANGE l 4 2</text>
<rect x="200" y="380" width="44" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="222.0" y="403.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">a</text>
<rect x="244" y="380" width="44" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="266.0" y="403.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">b</text>
<rect x="288" y="380" width="44" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="310.0" y="403.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">c</text>
