<text x="580" y="403" font-size="12" fill="#ea580c">start &gt; stop</text>
<text x="360" y="472" text-anchor="middle" font-size="12" fill="#64748b">start 和 stop 都包含在内（闭区间）；负数先加上长度再算，超出范围自动截断，不报错</text>
