<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" fill="#0f172a">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
  </defs>
  <text x="400" y="36" text-anchor="middle" font-size="16" font-weight="bold">读商品详情：先问 Redis，没有再查 MySQL</text>
  <!-- start -->
  <rect x="130" y="62" width="220" height="40" rx="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="177" y="87">请求</text><text x="211" y="87" font-family="Menlo, Consolas, monospace" font-size="13">product:1001</text>
  <line x1="240" y1="102" x2="240" y2="128" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="80" y="132" width="320" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="158">向 Redis 发</text><text x="218" y="158" font-family="Menlo, Consolas, monospace" font-size="13">GET product:1001</text>
  <line x1="240" y1="174" x2="240" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- diamond -->
  <path d="M240,204 L310,244 L240,284 L170,244 z" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="249" text-anchor="middle">有值？</text>
  <!-- yes -->
  <line x1="310" y1="244" x2="476" y2="244" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="330" y="236" font-weight="bold" fill="#16a34a">是</text>
  <text x="393" y="264" text-anchor="middle" font-size="12" fill="#16a34a">绝大多数请求走这里</text>
  <rect x="480" y="222" width="230" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="595" y="249" text-anchor="middle" fill="#16a34a">直接返回（不到 1 毫秒）</text>
  <line x1="595" y1="266" x2="595" y2="466" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
  <!-- no -->
  <line x1="240" y1="284" x2="240" y2="316" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="252" y="305" font-weight="bold" fill="#dc2626">否</text>
  <rect x="80" y="320" width="320" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="240" y="346" text-anchor="middle">查 MySQL（几毫秒~几十毫秒）</text>
  <line x1="240" y1="362" x2="240" y2="388" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="60" y="392" width="360" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="418">向 Redis 发</text><text x="178" y="418" font-family="Menlo, Consolas, monospace" font-size="13">SET product:1001 … EX 3600</text>
  <line x1="240" y1="434" x2="240" y2="466" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="160" y="470" width="160" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="495" text-anchor="middle">返回</text>
  <line x1="320" y1="490" x2="531" y2="490" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- end -->
  <rect x="535" y="470" width="120" height="40" rx="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="595" y="495" text-anchor="middle">结束</text>
  <text x="400" y="542" text-anchor="middle" font-size="12" fill="#64748b">EX 3600 表示这条缓存 3600 秒后过期，下次再从 MySQL 重新加载</text>
</svg>
