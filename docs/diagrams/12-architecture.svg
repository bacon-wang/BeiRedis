<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 496" width="800" height="496" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" fill="#0f172a">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="bold">Mini-Redis 整体架构：一条命令的旅程</text>

  <!-- process frames -->
  <rect x="20" y="56" width="190" height="336" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="115" y="80" text-anchor="middle" font-weight="bold" fill="#64748b">客户端进程</text>
  <rect x="300" y="56" width="480" height="336" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="316" y="80" font-weight="bold" fill="#64748b">服务端进程</text>

  <!-- client boxes -->
  <rect x="36" y="100" width="158" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="124" text-anchor="middle" font-weight="bold" fill="#2563eb">Client（你）</text>
  <text x="115" y="146" text-anchor="middle" font-size="13">Scanner 读一行</text>
  <text x="115" y="166" text-anchor="middle" font-size="13">打印回复</text>

  <rect x="36" y="240" width="158" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="115" y="264" text-anchor="middle" font-weight="bold" fill="#475569">TcpClient（框架）</text>
  <text x="115" y="286" text-anchor="middle" font-size="13">发送</text>
  <text x="115" y="306" text-anchor="middle" font-size="13">还原换行</text>

  <!-- server top row -->
  <rect x="316" y="100" width="104" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="368" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">EventLoop</text>
  <text x="368" y="140" text-anchor="middle" font-size="12" fill="#475569">（框架）</text>
  <text x="368" y="158" text-anchor="middle" font-size="12">凑满一行</text>

  <rect x="440" y="100" width="104" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="492" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">Parser</text>
  <text x="492" y="140" text-anchor="middle" font-size="12" fill="#475569">（框架）</text>
  <text x="492" y="158" text-anchor="middle" font-size="12">切成 String[]</text>

  <rect x="564" y="100" width="104" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="616" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Dispatcher</text>
  <text x="616" y="140" text-anchor="middle" font-size="12" fill="#2563eb">（你）</text>
  <text x="616" y="158" text-anchor="middle" font-size="12">查命令表、查参数</text>

  <rect x="688" y="100" width="80" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="728" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Command</text>
  <text x="728" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">.execute</text>
  <text x="728" y="158" text-anchor="middle" font-size="12" fill="#2563eb">（你）</text>

  <!-- database / hashmap -->
  <rect x="680" y="218" width="88" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="724" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Database</text>
  <text x="724" y="256" text-anchor="middle" font-size="12" fill="#2563eb">（你）</text>
  <rect x="680" y="300" width="88" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="724" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">MyHashMap</text>
  <text x="724" y="338" text-anchor="middle" font-size="12" fill="#2563eb">（你）</text>

  <!-- AOF -->
  <path d="M540,300 h76 l12,12 v44 h-88 z" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <path d="M616,300 v12 h12" fill="none" stroke="#ea580c" stroke-width="1.5"/>
  <text x="584" y="334" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#ea580c">data.aof</text>
  <rect x="408" y="308" width="112" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="464" y="333" text-anchor="middle" font-size="12" fill="#475569">FileUtil（框架）</text>
  <line x1="520" y1="328" x2="538" y2="328" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="464" y="372" text-anchor="middle" font-size="12" fill="#64748b">框架负责真正写盘</text>
  <!-- TCP band -->
  <path d="M200,280 L216,252 L216,262 L294,262 L294,252 L310,280 L294,308 L294,298 L216,298 L216,308 z" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="255" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">TCP</text>
  <text x="255" y="330" text-anchor="middle" font-size="12" fill="#64748b">一行一个</text>
  <text x="255" y="346" text-anchor="middle" font-size="12" fill="#64748b">请求/回复</text>

  <!-- request path -->
  <path d="M80,180 V238" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M194,270 H340 V172" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M420,135 H438" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M544,135 H562" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M668,135 H686" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M724,170 V216" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M724,266 V298" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M600,170 V298" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#ao)"/>
  <text x="590" y="232" text-anchor="end" font-size="12" fill="#ea580c">成功且是写命令</text>
  <text x="590" y="248" text-anchor="end" font-size="12" fill="#ea580c">才追加</text>

  <!-- reply path -->
  <path d="M728,100 V92 H392 V98" stroke="#16a34a" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="560" y="87" text-anchor="middle" font-size="12" fill="#16a34a">回复 String</text>
  <path d="M396,170 V292 H196" stroke="#16a34a" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <path d="M150,238 V182" stroke="#16a34a" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ag)"/>

  <!-- step numbers -->
  <circle cx="62" cy="209" r="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="62" y="213.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">①</text>
  <circle cx="326" cy="224" r="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="326" y="228.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">②</text>
  <circle cx="429" cy="186" r="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="429" y="190.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">③</text>
  <circle cx="553" cy="186" r="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="553" y="190.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">④</text>
  <circle cx="677" cy="186" r="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="677" y="190.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">⑤</text>
  <circle cx="614" cy="272" r="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="614" y="276.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#ea580c">⑥</text>
  <circle cx="500" cy="92" r="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="500" y="96.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">⑦</text>

  <!-- legend -->
  <line x1="20" y1="412" x2="780" y2="412" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400" y="438" text-anchor="middle" font-size="13">①读输入　②发送　③凑行　④切参数　⑤分发执行　⑥追加 AOF　⑦回复</text>
  <rect x="96" y="458" width="20" height="14" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="122" y="470" font-size="13">灰色 = 框架层（我写）</text>
  <rect x="276" y="458" width="20" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="302" y="470" font-size="13">蓝色 = 业务层（你写）</text>
  <line x1="456" y1="465" x2="490" y2="465" stroke="#475569" stroke-width="1.5"/>
  <text x="496" y="470" font-size="13">请求</text>
  <line x1="546" y1="465" x2="580" y2="465" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="586" y="470" font-size="13">回复</text>
  <rect x="636" y="458" width="20" height="14" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="662" y="470" font-size="13">磁盘文件</text>
</svg>
