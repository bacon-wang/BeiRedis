<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" fill="#0f172a">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>
<text x="400.0" y="32" text-anchor="middle" font-size="16" font-weight="bold">桶下标怎么算，扩容后去哪</text>
<text x="40" y="66" text-anchor="start" font-size="13" fill="#64748b" >以 "name" 为例（容量 cap = 16）</text>
<rect x="40" y="80" width="200" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<circle cx="60" cy="101" r="10" fill="#2563eb"/>
<text x="60" y="106" text-anchor="middle" font-size="12"  font-weight="bold" fill="#ffffff">1</text>
<text x="150.0" y="106" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" font-weight="bold" >key.hashCode()</text>
<text x="140.0" y="132" text-anchor="middle" font-size="13" fill="#0f172a" >3373707（0x337a8b）</text>
<line x1="242" y1="116.0" x2="296" y2="116.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ablue)"/>
<rect x="300" y="80" width="200" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<circle cx="320" cy="101" r="10" fill="#2563eb"/>
<text x="320" y="106" text-anchor="middle" font-size="12"  font-weight="bold" fill="#ffffff">2</text>
<text x="410.0" y="106" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" font-weight="bold" >h ^ (h &gt;&gt;&gt; 16)</text>
<text x="400.0" y="132" text-anchor="middle" font-size="13" fill="#0f172a" >扰动后 = 0x337ab8</text>
<line x1="502" y1="116.0" x2="556" y2="116.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ablue)"/>
<rect x="560" y="80" width="200" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<circle cx="580" cy="101" r="10" fill="#2563eb"/>
<text x="580" y="106" text-anchor="middle" font-size="12"  font-weight="bold" fill="#ffffff">3</text>
<text x="670.0" y="106" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" font-weight="bold" >h &amp; (cap − 1)</text>
<text x="660.0" y="132" text-anchor="middle" font-size="13" fill="#0f172a" >cap=16 → 下标 8</text>
<rect x="290" y="180" width="220" height="74" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
<path d="M400,152 L400,180" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="302" y="192" width="80" height="26" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" />
<text x="342" y="210" text-anchor="middle" font-size="12" fill="#0f172a" >高 16 位</text>
<rect x="418" y="192" width="80" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="458" y="210" text-anchor="middle" font-size="12" fill="#0f172a" >低 16 位</text>
<path d="M342,218 Q342,232 380,232 L440,232 Q458,232 458,222" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ablue)"/>
<text x="400" y="247" text-anchor="middle" font-size="11" fill="#2563eb" >混入</text>
<text x="400" y="272" text-anchor="middle" font-size="12" fill="#64748b" >&gt;&gt;&gt; 是无符号右移，左边补 0；把高位"揉"进低位，下标更分散</text>
<text x="560" y="210" text-anchor="start" font-size="12" fill="#64748b" >第 ③ 步只看最低 4 位：</text>
<text x="560" y="230" text-anchor="start" font-size="12" fill="#0f172a" font-family="Menlo, Consolas, monospace" >0x…b8 = …1011 1000</text>
<text x="560" y="248" text-anchor="start" font-size="12" fill="#0f172a" font-family="Menlo, Consolas, monospace" >&amp; 1111 → 1000 = 8</text>
<line x1="40" y1="296" x2="760" y2="296" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="40" y="324" text-anchor="start" font-size="14" fill="#0f172a" font-weight="bold" >扩容 16 → 32：下标改成 h &amp; 31，多看一位（第 4 位，从 0 数，值 16）</text>
<text x="145.0" y="356" text-anchor="middle" font-size="13" fill="#475569" >旧表 cap=16</text>
<text x="465.0" y="356" text-anchor="middle" font-size="13" fill="#2563eb" >新表 cap=32</text>
<text x="90" y="396" text-anchor="end" font-size="13" fill="#475569" font-family="Menlo, Consolas, monospace" >[5]</text>
<rect x="100" y="376" width="90" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" />
<text x="145.0" y="396" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >"city"</text>
<text x="410" y="396" text-anchor="end" font-size="13" fill="#16a34a" font-family="Menlo, Consolas, monospace" >[5]</text>
<rect x="420" y="376" width="90" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
<text x="465.0" y="396" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >"city"</text>
<line x1="194" y1="391.0" x2="374" y2="391.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agreen)"/>
<text x="524" y="396" text-anchor="start" font-size="12" fill="#16a34a" >低 5 位 00101，第 4 位是 0：原地不动</text>
<text x="90" y="456" text-anchor="end" font-size="13" fill="#475569" font-family="Menlo, Consolas, monospace" >[8]</text>
<rect x="100" y="436" width="90" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" />
<text x="145.0" y="456" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >"name"</text>
<text x="410" y="456" text-anchor="end" font-size="13" fill="#2563eb" font-family="Menlo, Consolas, monospace" >[24]</text>
<rect x="420" y="436" width="90" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="465.0" y="456" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >"name"</text>
<line x1="194" y1="451.0" x2="374" y2="451.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ablue)"/>
<text x="524" y="456" text-anchor="start" font-size="12" fill="#2563eb" >低 5 位 11000，第 4 位是 1：搬走，8+16</text>
<text x="90" y="516" text-anchor="end" font-size="13" fill="#475569" font-family="Menlo, Consolas, monospace" >[14]</text>
<rect x="100" y="496" width="90" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" />
<text x="145.0" y="516" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >"age"</text>
<text x="410" y="516" text-anchor="end" font-size="13" fill="#2563eb" font-family="Menlo, Consolas, monospace" >[30]</text>
<rect x="420" y="496" width="90" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="465.0" y="516" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >"age"</text>
<line x1="194" y1="511.0" x2="374" y2="511.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ablue)"/>
<text x="524" y="516" text-anchor="start" font-size="12" fill="#2563eb" >低 5 位 11110，第 4 位是 1：搬走，14+16</text>
<text x="400.0" y="580" text-anchor="middle" font-size="12" fill="#64748b" >扩容后每个元素要么留在原位，要么去 原位 + 旧容量</text>
</svg>
