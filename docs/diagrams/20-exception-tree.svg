<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" fill="#0f172a">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#475569" stroke-width="1.5"/></marker></defs>
<text x="400.0" y="32" text-anchor="middle" font-size="16" font-weight="bold">异常体系</text>
<rect x="200" y="56" width="160" height="36" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" />
<text x="280.0" y="79" text-anchor="middle" font-size="14" fill="#0f172a" font-family="Menlo, Consolas, monospace" font-weight="bold" >Exception</text>
<text x="372" y="79" text-anchor="start" font-size="12" fill="#64748b" >JDK 自带</text>
<rect x="60" y="128" width="440" height="136" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="280.0" y="148" text-anchor="middle" font-size="12" fill="#2563eb" >«abstract»  checked</text>
<text x="280.0" y="168" text-anchor="middle" font-size="14" fill="#0f172a" font-family="Menlo, Consolas, monospace" font-weight="bold" >RedisException</text>
<line x1="60" y1="180" x2="500" y2="180" stroke="#2563eb" stroke-width="1.5"/>
<text x="74" y="204" text-anchor="start" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" font-style="italic">+ prefix(): String</text>
<text x="240" y="204" text-anchor="start" font-size="12" fill="#64748b" >抽象，子类各自返回前缀</text>
<text x="74" y="228" text-anchor="start" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >+ toReply(): String</text>
<text x="96" y="250" text-anchor="start" font-size="12" fill="#475569" font-family="Menlo, Consolas, monospace" >= "(error) " + prefix() + " " + getMessage()</text>
<line x1="280.0" y1="128" x2="280.0" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#tri)"/>
<rect x="540" y="128" width="220" height="136" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" />
<text x="650.0" y="154" text-anchor="middle" font-size="14" fill="#ea580c" font-weight="bold" >为什么选 checked</text>
<text x="556" y="180" text-anchor="start" font-size="13" fill="#0f172a" >编译器强制：</text>
<text x="556" y="200" text-anchor="start" font-size="13" fill="#0f172a" >每个 execute 必须声明 throws，</text>
<text x="556" y="220" text-anchor="start" font-size="13" fill="#0f172a" >handle 必须 catch，</text>
<text x="556" y="240" text-anchor="start" font-size="13" fill="#0f172a" >漏写一处就编译不过</text>
<line x1="280.0" y1="306" x2="280.0" y2="266" stroke="#475569" stroke-width="1.5" marker-end="url(#tri)"/>
<line x1="150.0" y1="306" x2="650.0" y2="306" stroke="#475569" stroke-width="1.5"/>
<line x1="150.0" y1="306" x2="150.0" y2="340" stroke="#475569" stroke-width="1.5"/>
<line x1="400.0" y1="306" x2="400.0" y2="340" stroke="#475569" stroke-width="1.5"/>
<line x1="650.0" y1="306" x2="650.0" y2="340" stroke="#475569" stroke-width="1.5"/>
<path d="M150.0,306 L22,306 L22,430 L650.0,430" fill="none" stroke="#475569" stroke-width="1.5"/>
<line x1="150.0" y1="430" x2="150.0" y2="450" stroke="#475569" stroke-width="1.5"/>
<line x1="400.0" y1="430" x2="400.0" y2="450" stroke="#475569" stroke-width="1.5"/>
<line x1="650.0" y1="430" x2="650.0" y2="450" stroke="#475569" stroke-width="1.5"/>
<rect x="40" y="340" width="220" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="150.0" y="365" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >UnknownCommandException</text>
<text x="150.0" y="398" text-anchor="middle" font-size="12" fill="#64748b" >prefix = "ERR"</text>
<rect x="290" y="340" width="220" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="400.0" y="365" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >ArgCountException</text>
<text x="400.0" y="398" text-anchor="middle" font-size="12" fill="#64748b" >prefix = "ERR"</text>
<rect x="540" y="340" width="220" height="40" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" />
<text x="650.0" y="365" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >WrongTypeException</text>
<text x="650.0" y="398" text-anchor="middle" font-size="12" fill="#ea580c" >prefix = "WRONGTYPE"</text>
<rect x="40" y="450" width="220" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="150.0" y="475" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >NotIntegerException</text>
<text x="150.0" y="508" text-anchor="middle" font-size="12" fill="#64748b" >prefix = "ERR"</text>
<rect x="290" y="450" width="220" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="400.0" y="475" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >SyntaxException</text>
<text x="400.0" y="508" text-anchor="middle" font-size="12" fill="#64748b" >prefix = "ERR"</text>
<rect x="540" y="450" width="220" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="650.0" y="475" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Menlo, Consolas, monospace" >GenericErrorException</text>
<text x="650.0" y="508" text-anchor="middle" font-size="12" fill="#64748b" >prefix = "ERR"，其余错误</text>
<text x="400.0" y="546" text-anchor="middle" font-size="12" fill="#64748b" >空心三角箭头 = 继承（extends）；回复示例：(error) WRONGTYPE Operation against a key holding the wrong kind of value</text>
</svg>
